services:
  db:
    image: ${DB_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["postgres", "app"]

  litellm_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: ${LITELLM_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    profiles: ["litellm", "app"]

  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    restart: unless-stopped
    command: ["--config", "/llm/litellm_proxy_config.yaml"]
    ports:
      - "${LITELLM_PROXY_PORT}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@litellm_db:5432/${LITELLM_DB_NAME}
      STORE_MODEL_IN_DB: ${STORE_MODEL_IN_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./src/follow_up_engine/llm/litellm_proxy_config.yaml:/llm/litellm_proxy_config.yaml:ro
    depends_on:
      litellm_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    profiles: ["litellm", "app"]

  app:
    build: .
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "follow_up_engine",
        "load",
        "--seed-dir",
        "/seed",
      ]
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      DB_TYPE: ${DB_TYPE}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_MODEL_ALIAS: claude-5-sonnet
      EVENTS_FILENAME: ${EVENTS_FILENAME}
      QUOTES_FILENAME: ${QUOTES_FILENAME}
    volumes:
      - ./seed:/seed:ro
    profiles: ["app"]

volumes:
  pgdata:
  litellm_pgdata:
