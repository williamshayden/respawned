[project]
name = "respawned"
version = "1.0.0"
description = "Source-neutral follow-up orchestration with configurable review"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "William Hayden", email = "will.hayden0702@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.21.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.52",
    "tzdata>=2026.3",
    "uvicorn>=0.52.4",
]

[project.urls]
Repository = "https://github.com/williamshayden/follow-up-engine"
Issues = "https://github.com/williamshayden/follow-up-engine/issues"

[project.scripts]
respawned = "respawned.__main__:main"

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
