[project]
name = "respawned"
version = "0.1.0"
description = "Respawned follow-up orchestration with human review"
readme = "README.md"
authors = [
    { name = "William Hayden", email = "will.hayden0702@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.97.0",
    "openai>=2.21.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.52",
    "tzdata>=2026.3",
]

[project.scripts]
respawned = "respawned.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
