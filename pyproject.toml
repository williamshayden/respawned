[project]
name = "respawned"
version = "2.0.0"
description = "Follow-up workflow API with browser and CLI clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "William Hayden", email = "will.hayden0702@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.21.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.52",
    "tzdata>=2026.3",
    "uvicorn>=0.52.4",
]

[project.urls]
Repository = "https://github.com/williamshayden/respawned"
Issues = "https://github.com/williamshayden/respawned/issues"
Documentation = "https://respawned.williamshayden.com/"

[project.scripts]
respawned = "respawned.__main__:main"

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published source archives retain the frontend sources and locked rebuild tools.
# Compiled assets live under src/respawned and are included in both artifacts.
source-include = [
    "examples/outbox_client.py",
    "docs/agent-prompt.txt",
    "web/src/**",
    "web/scripts/**",
    "web/tests/**",
    "web/index.html",
    "web/package.json",
    "web/package-lock.json",
    "web/tsconfig.json",
    "web/vite.config.ts",
    "web/playwright.config.ts",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
