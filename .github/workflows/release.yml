name: Release

on:
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: Also publish through the configured PyPI Trusted Publisher
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on merged source
        run: python3 scripts/releases/github_release.py validate

  qualify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  github:
    needs: [validate, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify.outputs.distribution-artifact-id }}
          path: dist/release
          digest-mismatch: error
      - name: Publish or verify the exact GitHub release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/github_release.py publish --artifacts dist/release

  pypi:
    if: inputs.publish-pypi
    needs: [qualify, github]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/respawned
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify.outputs.distribution-artifact-id }}
          path: dist/release
          digest-mismatch: error
      - name: Publish qualified packages and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/release/downloads/
          attestations: true
          print-hash: true
